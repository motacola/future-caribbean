name: Caribbean Signal OS Pipeline

on:
  schedule:
    # Every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Manual run button

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: bash run_pipeline.sh

      - name: Commit and push updated artifacts
        run: |
          git config user.name "caribbean-bot"
          git config user.email "bot@caribbean-signal.os"
          git add dashboard.html outbox/ data/ signals/
          git diff --staged --quiet || git commit -m "Pipeline run: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
