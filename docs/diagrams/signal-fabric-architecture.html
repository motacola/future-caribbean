<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Fabric Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Signal Fabric</p>
    <h1>Caribbean Signal Pipeline</h1>

    <!-- viewbox 1200×740; legend strip at bottom -->
    <svg viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sf-arch-title sf-arch-desc">
      <title id="sf-arch-title">Signal Fabric Architecture</title>
      <desc id="sf-arch-desc">Public-data watchers feed a merger, editorial enrichment, and calibration pipeline that dispatches ranked Caribbean intelligence to a Vercel-hosted site and Telegram/WhatsApp/email delivery.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Page background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONE 1: SOURCES ===== -->
      <rect x="70" y="130" width="230" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="123" y="134" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="183" y="143" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SOURCES</text>

      <!-- ===== ZONE 2: CORE ENGINE ===== -->
      <rect x="300" y="130" width="220" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="370" y="134" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="143" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CORE ENGINE</text>

      <!-- ===== ZONE 3: OUTPUT ===== -->
      <rect x="540" y="130" width="420" height="320" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="658" y="134" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="716" y="143" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSUMERS &amp; OUTPUT</text>

      <!-- ====== ARROWS (drawn before nodes) ====== -->

      <!-- Arrow 1: Source Zone → Merger (muted) -->
      <path d="M 120,220 H 280 Q 280,220 288,220 V 290 H 376"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Label on vertical segment -->
      <rect x="266" y="274" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="282" y="281" fill="#7a8399" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNALS</text>

      <!-- Arrow 2: Merger → Editorial (accent — the judgment step) -->
      <path d="M 476,290 H 500"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="478" y="280" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="287" fill="#eb6c36" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENRICHED</text>

      <!-- Arrow 3: Editorial → Calibration (muted) -->
      <path d="M 600,290 H 616"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="600" y="280" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="610" y="287" fill="#7a8399" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCORED</text>

      <!-- Arrow 4: Calibration → Dispatch Desk (accent — focal flow into decision hub) -->
      <path d="M 672,290 H 680"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="664" y="274" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="281" fill="#eb6c36" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKAGED</text>

      <!-- Arrow 5: Dispatch Desk → API Surface (muted) -->
      <path d="M 860,290 H 920"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="870" y="280" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="882" y="287" fill="#7a8399" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SERVE</text>

      <!-- Arrow 6: Dispatch Desk → Channel Delivery (link-blue) -->
      <path d="M 893,380 V 438"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="880" y="416" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="894" y="423" fill="#2e5aa8" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <!-- Arrow 7: Vercel → API Surface (dashed link — hosting) -->
      <path d="M 1012,258 H 920"
            fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="948" y="248" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="966" y="255" fill="#2e5aa8" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOSTS</text>

      <!-- Arrow 8: Dispatch Desk → Vercel (dashed link — deploy path) -->
      <path d="M 596,380 V 196 H 1012"
            fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <rect x="602" y="274" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="281" fill="#2e5aa8" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

      <!-- ====== NODES ====== -->

      <!-- Node 1: World Bank watcher -->
      <rect x="68" y="200" width="112" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="206" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="94" y="215" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">WATCHER</text>
      <text x="124" y="240" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">World Bank</text>
      <text x="124" y="256" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">API:fdi</text>

      <!-- Node 2: IDB watcher -->
      <rect x="196" y="148" width="100" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="204" y="154" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="222" y="163" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">WATCHER</text>
      <text x="246" y="182" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">IDB</text>
      <text x="246" y="198" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">API:disbursements</text>

      <!-- Node 3: CDB watcher -->
      <rect x="196" y="228" width="100" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="204" y="234" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="222" y="243" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">WATCHER</text>
      <text x="246" y="262" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">CDB</text>
      <text x="246" y="278" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">Portal:tenders</text>

      <!-- Node 4: NOAA + NDBC watcher (combined) -->
      <rect x="68" y="300" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="306" width="48" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="100" y="315" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">WATCHER</text>
      <text x="138" y="340" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">NOAA + NDBC</text>
      <text x="138" y="356" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">Feeds:hurricane · storm</text>

      <!-- Node 5: Cross-Source Merger -->
      <rect x="376" y="254" width="100" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="384" y="260" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="402" y="269" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">MERGER</text>
      <text x="426" y="294" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Cross-Source</text>
      <text x="426" y="310" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">25+ signals</text>

      <!-- Node 6: Editorial Enrichment (FOCAL — coral) -->
      <rect x="500" y="254" width="100" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="508" y="260" width="44" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="530" y="269" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">EDITORIAL</text>
      <text x="550" y="294" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Editorial</text>
      <text x="550" y="310" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">enrichment.py</text>

      <!-- Node 7: Calibration & Packaging (FOCAL — coral) -->
      <rect x="616" y="254" width="64" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="622" y="260" width="52" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="644" y="269" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CALIBRATION</text>
      <text x="644" y="294" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Score 0–100</text>
      <text x="644" y="310" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">+ packaging</text>

      <!-- Node 8: Dispatch Desk (FOCAL — coral) -->
      <rect x="680" y="200" width="180" height="180" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="696" y="212" width="56" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="724" y="221" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">DISPATCH DESK</text>
      <text x="770" y="256" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Dispatch Desk</text>
      <text x="770" y="272" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">Decision hub</text>
      <text x="770" y="292" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">lead + cluster</text>
      <text x="770" y="312" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">scoring</text>
      <text x="770" y="332" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">selection</text>

      <!-- Node 9: API Surface -->
      <rect x="920" y="230" width="80" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="928" y="236" width="32" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="944" y="245" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="960" y="266" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">/api/*</text>
      <text x="960" y="282" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">15 endpoints</text>

      <!-- Node 10: Channel Delivery -->
      <rect x="760" y="438" width="200" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="444" width="52" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="794" y="453" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CHANNELS</text>
      <text x="860" y="478" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Telegram · WhatsApp</text>
      <text x="860" y="494" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">email · social snippets</text>

      <!-- Node 11: Vercel (external — ink @ 0.03 fill, ink @ 0.30 stroke) -->
      <rect x="1012" y="164" width="96" height="64" rx="6"
            fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1020" y="170" width="32" height="12" rx="2" fill="transparent"
            stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1036" y="179" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">HOSTING</text>
      <text x="1060" y="202" fill="#2d3142" font-size="12" font-weight="600"
            font-family="'Geist', sans-serif" text-anchor="middle">Vercel</text>
      <text x="1060" y="218" fill="#4f5d75" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">signal-fabric.vercel.app</text>

      <!-- ====== LEGEND (horizontal bottom strip) ====== -->
      <line x1="70" y1="672" x2="1130" y2="672"
            stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

      <text x="70" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">LEGEND</text>

      <!-- Solid arrow sample -->
      <path d="M 140,692 H 170" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="178" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">primary flow</text>

      <!-- Accent arrow sample -->
      <path d="M 310,692 H 340" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="348" y="696" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace">focal / editorial</text>

      <!-- Link-blue arrow sample -->
      <path d="M 490,692 H 520" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="528" y="696" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace">external / dispatch</text>

      <!-- Dashed link sample -->
      <path d="M 670,692 H 700" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <text x="708" y="696" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace">hosting / deploy</text>

      <!-- Coral node sample -->
      <rect x="860" y="684" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="890" y="696" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">focal node</text>

      <!-- External node sample -->
      <rect x="1000" y="684" width="24" height="16" rx="4"

      <text x="1030" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">external</text>

      <!-- Colophon -->
      <text x="70" y="720" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace"
            letter-spacing="0.08em">Signal Fabric · future-caribbean · Vercel serverless · 6 public-data watchers · 15 API endpoints</text>
    </svg>
  </div>
</body>
</html>
